name: Build and Release Plugin

on:
  push:
    branches: [ 'releases/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

  release:
    name: Build and release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean buildPlugin verifyPluginStructure

      - name: Get short commit hash
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get Gradle version
        id: version
        run: echo "version=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ steps.commit.outputs.short }}
          name: Release v${{ steps.version.outputs.version }}-${{ steps.commit.outputs.short }}
          target_commitish: ${{ github.sha }}
          files: build/distributions/toolwindow-controller-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
